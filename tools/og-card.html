<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@200;300;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    display: grid; place-items: center;
    font-family: 'Titillium Web', sans-serif;
    background:
      radial-gradient(120% 74% at 78% -10%, #fffbe0 0%, transparent 44%),
      linear-gradient(178deg, #2e93dd 0%, #93d9f7 46%, #dcf3c6 100%);
  }
  .cloud { position: absolute; border-radius: 50%; background: radial-gradient(circle at 50% 45%, #fff 0%, rgba(255,255,255,.92) 42%, rgba(255,255,255,.36) 66%, rgba(255,255,255,0) 86%); }
  .win {
    position: relative; width: 1020px; border-radius: 16px; overflow: hidden;
    box-shadow: 0 26px 50px rgba(0,0,0,.34);
  }
  .bar {
    display: flex; align-items: center; gap: 18px; height: 62px; padding: 0 26px;
    background-image:
      linear-gradient(180deg, rgba(255,255,255,.3) 0%, rgba(255,255,255,.1) 49.6%, rgba(255,255,255,0) 50%),
      linear-gradient(180deg, rgba(101,110,116,.78) 0%, rgba(18,22,26,.84) 50%, rgba(8,12,16,.86) 50.1%, rgba(58,64,68,.78) 100%);
    box-shadow: inset 0 2px 1px rgba(255,255,255,.3), inset 0 -2px 1px rgba(0,0,0,.4);
  }
  .brand { display: flex; align-items: center; gap: 11px; font-weight: 600; font-size: 26px; letter-spacing: .06em; color: rgba(255,255,255,.95); text-shadow: 0 1px 2px rgba(0,0,0,.55); }
  .dot { width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 34% 26%, #fff 4%, #b6ecff 22%, #34b6ea 58%, #0a4f86 100%); box-shadow: 0 2px 4px rgba(0,0,0,.4), inset 0 -2px 3px rgba(0,0,0,.25); }
  .sep { width: 2px; align-self: stretch; margin: 12px 0; background: linear-gradient(180deg, rgba(255,255,255,.32), rgba(255,255,255,.22) 36%, rgba(255,255,255,.36)); box-shadow: -1px 0 1px rgba(0,0,0,.4); }
  .kicker { font-size: 15px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: rgba(255,255,255,.6); text-shadow: 0 1px 2px rgba(0,0,0,.55); }
  .pane {
    display: grid; grid-template-columns: 300px 1fr; align-items: center; gap: 34px; padding: 44px 46px;
    background-image:
      linear-gradient(180deg, rgba(255,255,255,.14) 0%, rgba(255,255,255,.02) 22%, rgba(255,255,255,0) 44%),
      linear-gradient(180deg, rgba(101,110,116,.72) 0%, rgba(18,22,26,.82) 34%, rgba(8,12,16,.86) 100%);
    box-shadow: inset 0 -2px 1px rgba(0,0,0,.4);
  }
  h1 { font-weight: 200; font-size: 63px; line-height: 1.08; color: rgba(255,255,255,.96); text-shadow: 0 2px 4px rgba(0,0,0,.5); letter-spacing: -.01em; }
  p { margin-top: 20px; font-size: 22px; line-height: 1.45; color: rgba(255,255,255,.78); text-shadow: 0 1px 2px rgba(0,0,0,.55); max-width: 34ch; }
  .tag { margin-top: 26px; display: inline-flex; align-items: center; gap: 10px; font-family: 'Share Tech Mono', monospace; font-size: 17px; letter-spacing: .12em; text-transform: uppercase; color: rgba(255,255,255,.6); }
  .bead { width: 9px; height: 9px; border-radius: 50%; background: radial-gradient(circle at 34% 26%, #fff 6%, #6fe0a8 55%, rgba(0,0,0,.6) 100%); }
</style></head>
<body>
  <div class="cloud" style="width:420px;height:200px;left:-70px;top:40px;opacity:.85"></div>
  <div class="cloud" style="width:300px;height:150px;right:60px;top:-40px;opacity:.7"></div>
  <div class="cloud" style="width:520px;height:230px;left:120px;bottom:-120px;opacity:.55"></div>
  <div class="cloud" style="width:360px;height:170px;right:-60px;bottom:-40px;opacity:.6"></div>

  <div class="win">
    <div class="bar">
      <span class="brand"><span class="dot"></span>FUTURE</span>
      <span class="sep"></span>
      <span class="kicker">Hack Club &middot; You Ship, We Ship</span>
    </div>
    <div class="pane">
      <svg viewBox="0 0 400 440" width="300">
        <defs>
          <radialGradient id="body" cx="34%" cy="26%" r="82%">
            <stop offset="0%" stop-color="#fff"/><stop offset="20%" stop-color="#b6ecff"/>
            <stop offset="62%" stop-color="#34b6ea"/><stop offset="100%" stop-color="#0a4f86"/>
          </radialGradient>
          <radialGradient id="shade" cx="72%" cy="82%" r="70%">
            <stop offset="0%" stop-color="#063a63" stop-opacity=".55"/><stop offset="100%" stop-color="#063a63" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="spec" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#fff" stop-opacity=".95"/><stop offset="70%" stop-color="#fff" stop-opacity=".22"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="land" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#b4e565"/><stop offset="100%" stop-color="#4aa832"/></linearGradient>
          <linearGradient id="mir" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#34b6ea" stop-opacity=".4"/><stop offset="100%" stop-color="#34b6ea" stop-opacity="0"/></linearGradient>
          <clipPath id="clip"><circle cx="200" cy="190" r="132"/></clipPath>
          <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="9"/></filter>
          <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
        </defs>
        <ellipse cx="200" cy="196" rx="172" ry="52" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2"/>
        <circle cx="200" cy="190" r="132" fill="url(#body)"/>
        <g clip-path="url(#clip)">
          <g fill="url(#land)" opacity=".92">
            <path d="M96 148 C134 126 164 150 188 138 C212 126 228 152 210 176 C192 200 156 194 130 208 C106 220 82 200 90 178 Z"/>
            <path d="M246 108 C274 96 304 118 296 140 C288 162 256 158 240 142 C226 128 230 116 246 108 Z"/>
            <path d="M244 226 C282 210 328 232 340 262 C350 288 316 304 288 292 C260 280 232 256 244 226 Z"/>
          </g>
          <g fill="none" stroke="#fff" stroke-opacity=".24" stroke-width="1.4">
            <ellipse cx="200" cy="190" rx="132" ry="46"/><ellipse cx="200" cy="190" rx="132" ry="94"/>
            <ellipse cx="200" cy="190" rx="60" ry="132"/><ellipse cx="200" cy="190" rx="112" ry="132"/>
          </g>
          <circle cx="200" cy="190" r="132" fill="url(#shade)"/>
          <ellipse cx="168" cy="106" rx="86" ry="50" fill="url(#spec)" filter="url(#blur)"/>
          <path d="M200 322 A132 132 0 0 0 326 214" fill="none" stroke="#b4e565" stroke-opacity=".75" stroke-width="7" stroke-linecap="round" filter="url(#blur)"/>
        </g>
        <ellipse cx="150" cy="96" rx="26" ry="14" fill="#fff" opacity=".9" transform="rotate(-24 150 96)"/>
        <path d="M28 196 A172 52 0 0 0 372 196" fill="none" stroke="#fff" stroke-width="2.5" stroke-opacity=".85"/>
        <circle cx="330" cy="176" r="6.5" fill="#fff"/>
        <ellipse cx="200" cy="352" rx="118" ry="26" fill="url(#mir)" filter="url(#soft)"/>
      </svg>
      <div>
        <h1>Build the future<br>of your childhood.</h1>
        <p>The future of 1920, of 2010, or the one being imagined right now. Build a real piece of it and we ship you the hardware.</p>
        <span class="tag"><span class="bead"></span>ship it, spend the hours on real gear</span>
      </div>
    </div>
  </div>
</body></html>
