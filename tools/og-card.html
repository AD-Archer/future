<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  /* Glossy early-2000s, at card scale: bright sky, the mark on its reflection,
     dark type, one green gel. Same tokens as src/app.css. */
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    font-family: 'Source Sans 3', 'Lucida Grande', Tahoma, sans-serif;
    color: #16324a;
    background: linear-gradient(180deg, #0f4f99 0%, #3d93da 42%, #9ed3f2 78%, #d5ecfa 100%);
  }
  .sun {
    position: absolute; top: -22%; left: 2%; width: 60%; height: 70%; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,251,224,.6) 0%, rgba(255,248,205,.24) 38%, rgba(255,248,205,0) 68%);
  }
  .cloud {
    position: absolute; filter: blur(14px);
    background:
      radial-gradient(circle at 30% 62%, #fff 0%, rgba(255,255,255,.86) 42%, rgba(255,255,255,0) 68%),
      radial-gradient(circle at 62% 40%, #fff 0%, rgba(255,255,255,.9) 40%, rgba(255,255,255,0) 66%),
      radial-gradient(circle at 82% 66%, #fff 0%, rgba(255,255,255,.8) 38%, rgba(255,255,255,0) 64%);
  }

  .mark { position: absolute; left: 86px; top: 148px; width: 300px; }
  .mark img {
    width: 100%; display: block;
    filter: drop-shadow(0 10px 14px rgba(12,52,90,.32));
    -webkit-box-reflect: below 2px linear-gradient(to bottom, rgba(0,0,0,0) 58%, rgba(0,0,0,.22) 100%);
  }

  .copy { position: absolute; left: 440px; top: 150px; width: 690px; }
  h1 {
    font-size: 64px; font-weight: 700; line-height: 1.06; letter-spacing: -.025em; color: #fff;
    text-shadow: 0 1px 0 rgba(0,42,82,.4), 0 3px 16px rgba(0,42,82,.35);
  }
  p {
    margin-top: 18px; font-size: 22px; line-height: 1.45; max-width: 30ch; color: #fff;
    text-shadow: 0 1px 4px rgba(0,42,82,.45);
  }

  .gel {
    position: absolute; left: 440px; top: 452px;
    display: inline-flex; align-items: center; padding: 13px 32px;
    border: 1px solid #275f10; border-radius: 999px;
    font-size: 21px; font-weight: 700; color: #12360a;
    text-shadow: 0 1px 0 rgba(255,255,255,.5);
    background-image:
      linear-gradient(180deg, rgba(255,255,255,.82) 0%, rgba(255,255,255,.34) 47.9%, rgba(255,255,255,.05) 48%, rgba(255,255,255,.26) 100%),
      linear-gradient(180deg, #bcec72 0%, #3a8418 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.9), inset 0 -1px 2px rgba(0,0,0,.2), 0 5px 12px rgba(10,40,70,.24);
  }

  .brand { position: absolute; left: 86px; bottom: 44px; display: flex; align-items: center; gap: 12px; }
  .brand img { width: 40px; height: 40px; filter: drop-shadow(0 1px 2px rgba(12,52,90,.35)); }
  .word { font-size: 20px; font-weight: 700; letter-spacing: .28em; margin-right: -.28em; color: #16324a; }
  .tag { position: absolute; right: 56px; bottom: 52px; font-family: 'Share Tech Mono', monospace; font-size: 16px; letter-spacing: .08em; text-transform: uppercase; color: #47657e; }
</style></head>
<body>
  <span class="sun"></span>
  <div class="cloud" style="width:300px;height:126px;left:-40px;bottom:-30px;opacity:.7"></div>
  <div class="cloud" style="width:240px;height:100px;right:60px;bottom:-40px;opacity:.55"></div>
  <div class="cloud" style="width:200px;height:84px;left:520px;bottom:10px;opacity:.4"></div>

  <div class="mark"><img src="../public/dolphin.png" alt=""></div>

  <div class="copy">
    <h1>Build the future<br>of your childhood.</h1>
    <p>The future of 1920, of 2010, or the one being imagined right now. Build a real piece of it and we ship you the hardware.</p>
  </div>

  <span class="gel">Get onboarded</span>

  <div class="brand">
    <img src="../public/dolphin.png" alt="">
    <span class="word">FUTURE</span>
  </div>
  <div class="tag">a hack club you ship, we ship</div>
</body></html>
