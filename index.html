<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/Logo.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>FUTURE — Build the future of your childhood</title>
    <meta
      name="description"
      content="A Hack Club You Ship, We Ship. Build the future of your childhood: the future of 1920, of 2010, or the one being imagined right now. Ship it and we ship you hardware."
    />
    <link rel="canonical" href="%SITE_URL%/" />
    <meta name="theme-color" content="#2e93dd" />

    <!-- Link previews. %SITE_URL% is substituted at build time (vite.config.js);
         set SITE_URL when the deploy domain differs from the default. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FUTURE" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="FUTURE — Build the future of your childhood" />
    <meta
      property="og:description"
      content="Any vision of the future counts: 1920, 2010, or today. Build a real piece of it, ship it open-source, and spend the hours you log on real gear."
    />
    <meta property="og:image" content="%SITE_URL%/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A glossy blue-and-green world floating in a smoked-glass window against a bright sky, beside the words Build the future of your childhood."
    />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FUTURE — Build the future of your childhood" />
    <meta
      name="twitter:description"
      content="Any vision of the future counts: 1920, 2010, or today. Build a real piece of it, ship it open-source, and spend the hours you log on real gear."
    />
    <meta name="twitter:image" content="%SITE_URL%/og.jpg" />
    <meta
      name="twitter:image:alt"
      content="A glossy blue-and-green world floating in a smoked-glass window against a bright sky, beside the words Build the future of your childhood."
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
